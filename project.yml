name: TechPulse
options:
  bundleIdPrefix: com.johnchen
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TechPulse:
    type: application
    platform: iOS
    sources: [TechPulse]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnchen.TechPulse
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
