name: TechPulse
options:
  bundleIdPrefix: com.johnchen
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TechPulse:
    type: application
    platform: iOS
    sources: [TechPulse]
    info:
      path: TechPulse/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.johnchen.TechPulse.refresh
        ITSAppUsesNonExemptEncryption: false
        # Widget taps deep-link back in: techpulse://feed | knowledge | ...
        CFBundleURLTypes:
          - CFBundleURLName: com.johnchen.TechPulse
            CFBundleURLSchemes: [techpulse]
    dependencies:
      - target: TechPulseWidgetExtension
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnchen.TechPulse
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TechPulse/TechPulse.entitlements

  # WidgetKit extension. Sources are listed file-by-file rather than pointing at
  # TechPulse/ wholesale: the widget needs only the design tokens and the
  # snapshot model, and must not pull in UITextView-backed views.
  TechPulseWidgetExtension:
    type: app-extension
    platform: iOS
    sources:
      - TechPulseWidget
      - path: TechPulse/Views/Theme.swift
      - path: TechPulse/Models/WidgetSnapshot.swift
    info:
      path: TechPulseWidget/Info.plist
      properties:
        CFBundleDisplayName: TechPulse
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnchen.TechPulse.widget
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: TechPulseWidget/TechPulseWidget.entitlements
  TechPulseUITests:
    type: bundle.ui-testing
    platform: iOS
    # `Tests/Support` is the journeys' bookkeeping — step ledger and screenshot
    # freshness. It holds no XCUITest API, so the unit bundle compiles it too
    # and covers it there, where a failure costs a second rather than a launch.
    sources: [Tests/UITests, Tests/Support]
    dependencies:
      - target: TechPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
  TechPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/UnitTests, Tests/Support]
    dependencies:
      - target: TechPulse
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TechPulse.app/TechPulse
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  TechPulse:
    build:
      targets:
        TechPulse: all
        TechPulseWidgetExtension: all
        TechPulseUITests: [test]
        TechPulseTests: [test]
    run:
      config: Debug
    test:
      targets: [TechPulseTests, TechPulseUITests]
  # Unit tests only — usable on a physical device, where the XCUITest
  # runner can't be provisioned from the command line (no Xcode account).
  TechPulseUnitTests:
    build:
      targets:
        TechPulse: all
        TechPulseTests: [test]
    test:
      targets: [TechPulseTests]
