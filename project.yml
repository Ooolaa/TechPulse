name: TechPulse
options:
  bundleIdPrefix: com.johnchen
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
targets:
  TechPulse:
    type: application
    platform: iOS
    sources: [TechPulse]
    info:
      path: TechPulse/Info.plist
      properties:
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        BGTaskSchedulerPermittedIdentifiers:
          - com.johnchen.TechPulse.refresh
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.johnchen.TechPulse
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: TechPulse/TechPulse.entitlements
  TechPulseUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests/UITests]
    dependencies:
      - target: TechPulse
  TechPulseTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests/UnitTests]
    dependencies:
      - target: TechPulse
    settings:
      base:
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/TechPulse.app/TechPulse
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  TechPulse:
    build:
      targets:
        TechPulse: all
        TechPulseUITests: [test]
        TechPulseTests: [test]
    run:
      config: Debug
    test:
      targets: [TechPulseTests, TechPulseUITests]
